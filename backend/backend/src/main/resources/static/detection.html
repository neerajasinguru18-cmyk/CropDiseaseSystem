
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Disease Detection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f8f0;
            margin: 0;
            padding: 20px;
        }

        header {
            background: #237a35;
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 10px;
        }

        .container {
            max-width: 650px;
            background: white;
            margin: 30px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ccc;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        select, textarea, input[type="file"] {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #237a35;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #185c27;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            display: none;
        }

        #preview {
            max-width: 100%;
            max-height: 300px;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
        }

        a {
            color: green;
        }
    </style>
</head>

<body>

<header>
    <h1>🔍 Crop Disease Detection</h1>
    <p>Upload a crop leaf image to identify possible diseases using AI</p>
</header>

<div class="container">

    <h2>Detect Crop Disease</h2>

    <form id="detectionForm">

        <label>Select Crop</label>
        <select id="crop" required>
            <option value="">-- Select Crop --</option>
            <option value="rice">Rice</option>
            <option value="wheat">Wheat</option>
            <option value="maize">Maize</option>
            <option value="cotton">Cotton</option>
            <option value="tomato">Tomato</option>
            <option value="grape">Grape</option>
            <option value="potato">Potato</option>
            <option value="apple">Apple</option>
            <option value="other">Other</option>
        </select>

        <label>Upload Leaf Image</label>
        <input type="file" id="leafImage" accept="image/*" required>

        <img id="preview" alt="Leaf image preview">

        <label>Describe Symptoms (Optional)</label>
        <textarea id="symptoms" rows="4"
            placeholder="Example: Brown spots, yellow leaves, wilting..."></textarea>

        <button type="submit" id="detectBtn">Detect Disease using AI</button>

    </form>

    <div id="result"></div>

    <p style="text-align:center; margin-top:25px;">
        <a href="/dashboard.html">Back to Dashboard</a>
    </p>

</div>

<script>

const form = document.getElementById("detectionForm");
const imageInput = document.getElementById("leafImage");
const result = document.getElementById("result");
const preview = document.getElementById("preview");
const detectBtn = document.getElementById("detectBtn");

// Show uploaded image preview
imageInput.addEventListener("change", function () {

    const file = this.files[0];

    if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
        result.style.display = "none";
    }
});

// Send image to AI backend
form.addEventListener("submit", async function (event) {

    event.preventDefault();

    const file = imageInput.files[0];

    if (!file) {
        alert("Please upload a leaf image.");
        return;
    }

    detectBtn.disabled = true;
    detectBtn.textContent = "AI is analyzing the image...";
    result.style.display = "block";
    result.innerHTML = "<p>🌿 Analyzing leaf image. Please wait...</p>";

    try {

        const formData = new FormData();
        formData.append("image", file);

        const response = await fetch(
            "http://localhost:8084/api/detection/predict",
            {
                method: "POST",
                body: formData
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                typeof data === "string"
                    ? data
                    : "AI prediction failed."
            );
        }

        const diseaseName = data.disease
            .replaceAll("___", " - ")
            .replaceAll("_", " ");

        const confidence = Number(data.confidence);

        result.innerHTML = `
            <h3>🌱 AI Prediction Result</h3>
            <p><strong>Selected Crop:</strong> ${document.getElementById("crop").value}</p>
            <p><strong>Predicted Disease:</strong> ${diseaseName}</p>
            <p><strong>Confidence Score:</strong> ${confidence.toFixed(2)}%</p>
            <p>
                <strong>Symptoms Provided:</strong>
                ${document.getElementById("symptoms").value || "None"}
            </p>
            <hr>
            <p>⚠️ AI prediction is only an estimate. Please confirm with an agricultural expert.</p>
        `;

    } catch (error) {

        result.innerHTML = `
            <h3>❌ Prediction Failed</h3>
            <p>${error.message}</p>
            <p>Make sure the AI backend is running on port 8084.</p>
        `;

    } finally {

        detectBtn.disabled = false;
        detectBtn.textContent = "Detect Disease using AI";

    }

});

</script>

</body>
</html>
